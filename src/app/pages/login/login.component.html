<div 
  class="flex items-center justify-center h-screen bg-blue-100" 
  style="background-image: url('assets/images/b675fccd-b62f-40f5-a384-387ed8195315.jpg'); background-size: cover; background-position: center;"
>
  <div class="bg-white bg-opacity-100 p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-blue-500 mb-6">Welcome Back</h2>

    <!-- Email Input -->
    <label class="block text-blue-500 font-medium mb-2">Email</label>
    <input 
      type="email" 
      placeholder="Enter your email"
      [(ngModel)]="email"
      class="w-full px-4 py-2 mb-4 border border-blue-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" 
    />

    <!-- OTP Input -->
    <label class="block text-blue-500 font-medium mb-2">OTP</label>
    <input 
      type="text" 
      placeholder="Enter OTP"
      [(ngModel)]="otp"
      class="w-full px-4 py-2 mb-6 border border-blue-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" 
    />

    <!-- Send OTP Button -->
    <button 
      (click)="sendOtp()"
      [disabled]="!email"
      class="w-full py-2 rounded-lg text-white mb-3 transition-colors"
      [ngClass]="!email ? 'bg-blue-300 cursor-not-allowed' : 'bg-blue-500 hover:bg-blue-600'"
    >
      Send OTP
    </button>

    <!-- Verify OTP Button -->
    <button 
      (click)="verifyOtp()"
      [disabled]="!otp"
      class="w-full py-2 rounded-lg text-white transition-colors"
      [ngClass]="!otp ? 'bg-blue-300 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'"
    >
      Verify OTP
    </button>
  </div>
</div>
