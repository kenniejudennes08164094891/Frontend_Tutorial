<body class="bg-blue-600 flex items-center justify-center min-h-screen">
  <div class="w-full max-w-md bg-white rounded-xl shadow-md p-8 space-y-6">
    <div class="text-center">
      <h1 class="text-2xl font-bold text-gray-800">FinTech Login</h1>
      <p class="text-sm text-gray-500">Secure login with 2FA</p>
    </div>

    <form class="space-y-4">
      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" placeholder="you@example.com" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
          title="Please enter a valid email address" [(ngModel)]="userCredentials.email" name="email" required
          class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <!-- Password... -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" placeholder="Enter your password" pattern=".{8,}"
          title="Password must be at least 8 characters long" [(ngModel)]="userCredentials.password" name="password"
          required
          class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <!-- OTP -->
      <div *ngIf="showOTPInput === true">
        <label class="block text-sm font-medium text-gray-700">One-Time Password (OTP)</label>
        <input type="text" placeholder="Input 6 digits generated OTP" maxlength="6" pattern="\d{6}" required [(ngModel)]="otpInput.otp"
          name="otp"
          class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <p class="text-xs text-gray-400 mt-1">Check your email or app for the OTP</p>
      </div>

      <!-- Submit Button -->
      <div *ngIf="showOTPInput === false">
        <button (click)="loginSubmit()" type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-300">
          Login Securely
        </button>
      </div>
      <div *ngIf="showOTPInput === true">
        <button (click)="handleOTPInput()" type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-300">
          Verify OTP
        </button>
      </div>
    </form>
  </div>
</body>
