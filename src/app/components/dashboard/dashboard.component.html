<body class="h-full">

  <!-- Sidebar and Content -->
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-md px-6 py-8 flex flex-col justify-between h-screen">
      <div>
        <h2 class="text-2xl font-bold mb-6 text-blue-600">Fintech Admin</h2>
        <nav class="space-y-4">
          <a href="#" class="text-gray-700 hover:text-blue-600 block">Dashboard</a>
          <a href="#" class="text-gray-700 hover:text-blue-600 block">Transactions</a>
          <a href="#" class="text-gray-700 hover:text-blue-600 block">ATM Cards</a>
          <a href="#" class="text-gray-700 hover:text-blue-600 block">Issues</a>
          <a href="#" class="text-gray-700 hover:text-blue-600 block">Settings</a>
        </nav>
      </div>

      <!-- Logout Button -->
      <button (click)="logoutUser()" class="mt-8 text-red-600 hover:text-red-800 font-semibold flex items-center gap-2">
        Logout
        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M16 12H4m12 0-4 4m4-4-4-4m3-4h2a3 3 0 013 3v10a3 3 0 01-3 3h-2" />
        </svg>
      </button>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 overflow-y-auto bg-gray-50">
      <header class="mb-6">
        <h1 class="text-3xl font-bold text-gray-800">Dashboard Overview</h1>
        <p class="text-gray-500">Monitor all core financial activities and operations</p>
      </header>

      <!-- Statistics Cards -->
      <app-child (emmitCard)="getStatusFromChild($event)" [isMarked]="isToBeMarked"></app-child>



      <!-- Recent Transactions Table -->
      <section class="bg-white p-6 rounded-xl shadow">
        <!-- Search Input -->
        <div class="mb-4">
          <input type="text" placeholder="Search transactions..." name="searchQuery" [(ngModel)]="searchQuery"
            (ngModelChange)="listenToInput($event)"
            class="w-64 px-4 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div class="float-right">
          <button (click)="openTransactionModal()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">
            Create Transaction
          </button>
        </div>
        <br>

        <h2 class="text-xl font-semibold text-gray-700 mb-4" on-click="emmitOddNumbers()">Recent Transactions: {{evenNumbers}}</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead class="bg-gray-100">
              <tr>
                <th class="p-3 text-sm font-medium text-gray-600">#</th>
                <th class="p-3 text-sm font-medium text-gray-600">Date</th>
                <th class="p-3 text-sm font-medium text-gray-600">Type</th>
                <th class="p-3 text-sm font-medium text-gray-600">Amount</th>
                <th class="p-3 text-sm font-medium text-gray-600">Status</th>
                <th class="p-3 text-sm font-medium text-gray-600"></th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of transaction | transactions : searchQuery; let id = index;" class="border-t">
                <td class="p-3 text-sm text-gray-800">{{id + 1}}</td>
                <td class="p-3 text-sm text-gray-800">{{item.date}}</td>
                <td class="p-3 text-sm text-blue-600 font-medium">{{item.type}}</td>
                <td class="p-3 text-sm text-gray-800">{{item.amount}}</td>
                <td class="p-3 text-sm">
                  <div [ngSwitch]="item.status">
                    <span *ngSwitchCase="'Completed'" class="text-green-600">Completed</span>
                    <span *ngSwitchCase="'Pending'" class="text-yellow-600">Pending</span>
                    <span *ngSwitchCase="'Failed'" class="text-red-600">Failed</span>
                    <span *ngSwitchDefault class="text-gray-600">Unknown</span>
                  </div>
                </td>
                <td class="p-3 text-sm text-gray-800">
                  <button (click)="showMarked(item.status)"
                    class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">
                    show ✅
                  </button>
                  &nbsp;
                  <button (click)="viewDetails(item, id+1)"
                    class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">
                    View Details
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>
</body>
